<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" width="1000" height="615" role="img" aria-labelledby="title description">
<title id="title">From your question to a recorded campaign</title>
<desc id="description">You give Claude Science a target, the tools you name, compute routes, a budget, and your approval. Claude Science discovers tools and routes, compares them by runtime, cost, and evidence, proposes the plan, and asks only about choices that change the work. The bundled Binder runtime validates the plan before executing, runs the stages, hashes artifacts, and records receipts and costs. Each stage can use Modal, fal, RunPod, Lambda Cloud, a managed endpoint or NVIDIA BioNeMo NIM, or a local or SSH/HPC route. The campaign returns ranked candidates, predicted structures, uncertainty, provenance, costs, and an offline viewer.</desc>
