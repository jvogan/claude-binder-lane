<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-labelledby="title description">
<title id="title">The computational workflow</title>
<desc id="description">Six stages in one path, top to bottom. One: prepare the target and site. Two: check prediction and scoring methods against controls. Three: generate and filter candidates. Four: predict target-binder complexes and score them. Five: rescore and refine promising designs. Six: report a computational shortlist with structures, uncertainty, provenance, and costs. Stages three, four, and five sit in one group: refinement can return to generation for another round within the approved plan.</desc>
