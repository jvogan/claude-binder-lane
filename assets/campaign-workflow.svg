<text x="48" y="58" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#30302b"><tspan x="48" dy="0">The computational workflow</tspan></text>
<rect x="48" y="248" width="904" height="276" rx="28" fill="#e6edf8"/>
<rect x="66" y="82" width="620" height="56" rx="16" fill="#f3ead6"/>
