<text x="100" y="393.2" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#faf9f5"><tspan x="100" dy="0">4</tspan></text>
<text x="136" y="394.6" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#30302b"><tspan x="136" dy="0">Predict and score</tspan></text>
