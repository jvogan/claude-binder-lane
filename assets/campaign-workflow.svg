<text x="136" y="118.6" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#30302b"><tspan x="136" dy="0">Prepare target</tspan></text>
<text x="396" y="116.5" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#56564f"><tspan x="396" dy="0">Construct and binding site</tspan></text>
