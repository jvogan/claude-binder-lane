<circle cx="732" cy="221" r="17" fill="#faf9f5"/>
<circle cx="732" cy="221" r="14" fill="#5c6487"/>
<path d="M728.5 214.5 L736 221 L728.5 227.5" fill="none" stroke="#faf9f5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="384,351 396,368 372,368" fill="#5c6487" stroke="#5c6487" stroke-width="4" stroke-linejoin="round"/>
<path d="M848 349 L848 365.5 Q848 382 831.5 382 L394.4 382 Q384 382 384 371.6 L384 361.2" fill="none" stroke="#5c6487" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 11"/>
<text x="616" y="412" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#5c6487"><tspan x="616" dy="0">Claude Science asks again only if the plan exceeds the</tspan><tspan x="616" dy="24">approval, or the approval expires.</tspan></text>
<rect x="48" y="472" width="440" height="70" rx="18" fill="#e9e7ee"/>
<rect x="512" y="472" width="440" height="70" rx="18" fill="#f3ead6"/>
<text x="70" y="501.84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#30302b"><tspan x="70" dy="0">The Binder runtime records a receipt and the</tspan><tspan x="70" dy="24">cost of each stage.</tspan></text>
<text x="534" y="501.84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#30302b"><tspan x="534" dy="0">If a run stops, correct the cause, then resume</tspan><tspan x="534" dy="24">the same run.</tspan></text>
</svg>
