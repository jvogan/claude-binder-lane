<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="title description">
<title id="title">Two ways to design, one way to check</title>
<desc id="description">Two design paths feed one check. On the two-step path, a backbone generator (RFdiffusion, RFdiffusion3, PXDesign, or Genie3, which gives C-alpha output and needs a compatible sequence designer) comes first and a sequence designer (ProteinMPNN, SolubleMPNN, LigandMPNN, or SolubleCaliby) follows. On the joint path, one tool designs structure and sequence together (BoltzGen, FreeBindCraft, BindCraft2, or Proteina-Complexa). A campaign can use either path or combine them. Both paths feed co-folding with the target (ESMFold2, ESMFold2-Fast, Boltz Cloud, local Boltz-2, Chai-1, OpenFold3, AlphaFold2-Multimer-v3, or Protenix v2), then scoring and ranking with DockQ, ipSAE, the selected ranking metric, controls, and filters.</desc>
